name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.24"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check gdtensor gdtensor_sim tests
      - name: Lint
        run: uv run --locked ruff check --no-cache gdtensor gdtensor_sim tests
      - name: Compile
        run: uv run --locked python -m compileall -q gdtensor gdtensor_sim tests
      - name: Pure core + IO tests (no torch; zero skip)
        # Real DCP cache cases run in the torch job, with the same zero-skip gate.
        run: |
          set -euo pipefail
          uv run --locked pytest -v -p no:cacheprovider tests/core tests/io \
            --ignore=tests/io/test_real_file_cache_strategy.py -rs | tee no_torch.txt
          bad="$(grep '^SKIPPED' no_torch.txt || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected skips in pure no-torch job:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: No-torch import probe (core must not depend on torch)
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import subprocess, sys
          code = "import sys; import gdtensor; bad=[m for m in list(sys.modules) if m.startswith('torch')]; sys.exit(1 if bad else 0)"
          subprocess.run([sys.executable, "-c", code], check=True)
          print("core imports torch: no")
          PY
      - name: "Behavioral mutations (core API guards + cache cap/ACK)"
        if: matrix.python == '3.12'
        # The notorch detector set includes distcp detectors that import torch;
        # install the locked CPU torch extra so no detector silently fails its
        # baseline. The probe above still proves the core package itself never
        # imports torch in a torch-free interpreter.
        run: |
          uv sync --locked --extra torch-cpu
          uv run --locked --extra torch-cpu python tests/mutation_check.py --group notorch

  torch:
    name: Torch, types and LAWA (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDTENSOR_TORCH_TESTS: "1"
      GDTENSOR_LAWA_JOIN_SECONDS: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CPU torch dependencies
        run: uv sync --locked --extra torch-cpu
      - name: Type check (ty)
        run: uv run --locked --extra torch-cpu ty check --error-on-warning
      - name: Type check (Pyrefly)
        run: uv run --locked --extra torch-cpu pyrefly check --min-severity=warn
      - name: Bridge, LAWA, sim DCP and checkpoint distcp (zero skip)
        run: |
          set -euo pipefail
          uv run --locked --extra torch-cpu pytest -v -s -p no:cacheprovider \
            tests/torch tests/sim tests/checkpoint tests/demo \
            tests/io/test_real_file_cache_strategy.py -rs | tee torch.txt
          if grep -q '^SKIPPED' torch.txt; then
            echo "Unexpected skips in torch job (must be zero):" >&2
            grep '^SKIPPED' torch.txt >&2
            exit 1
          fi
      - name: CLI smoke (real python -m subprocess; distcp/safetensors x single/per_rank)
        run: |
          set -euo pipefail
          uv run --locked --extra torch-cpu pytest -v -s -p no:cacheprovider \
            tests/sim/test_cli_smoke.py -rs | tee cli.txt
          if grep -q '^SKIPPED' cli.txt; then
            echo "CLI smoke was skipped (torch must import; only torch importorskip is legal):" >&2
            grep '^SKIPPED' cli.txt >&2
            exit 1
          fi
          if ! grep -q '4 passed' cli.txt; then
            echo "CLI smoke did not collect all 4 cases (expect distcp/safetensors x single/per_rank)" >&2
            exit 1
          fi
      - name: "Behavioral mutations (torch: DCP contiguous-guard)"
        run: uv run --locked --extra torch-cpu python tests/mutation_check.py --group torch

  formal:
    name: Formal proofs (Lean v4.34.0 + TLC v1.8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan (Lean version manager; toolchain pinned by formal/lean/lean-toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean proof + real TLC model checking (pinned, sha256-verified jar)
        run: bash scripts/formal_gate.sh

  gate:
    name: CI gate
    if: always()
    needs: [checks, torch, formal]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TORCH_RESULT: ${{ needs.torch.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TORCH_RESULT" = success
          test "$FORMAL_RESULT" = success
