name: gdtensor pre-merge gate

trigger:
  change:
    branches: [main]
  manual:

jobs:
  gate:
    name: lint + full non-torch tests
    image: hub.byted.org/codebase/ci_python_311
    steps:
      - name: Install dependencies
        commands:
          - python3 -m pip install -i https://bytedpypi.byted.org/simple uv
          - uv sync --locked
      - name: Show tool versions
        commands:
          - uv run --locked python --version
          - uv run --locked ruff --version
      - name: Format check
        commands:
          - uv run --locked ruff format --check gdtensor gdtensor_sim tests
      - name: Lint imports and undefined names (ruff F)
        commands:
          - uv run --locked ruff check gdtensor gdtensor_sim tests
      - name: Byte-compile
        commands:
          - uv run --locked python -m compileall -q gdtensor gdtensor_sim tests
      - name: Public package import smoke
        commands:
          - uv run --locked python -c "import gdtensor, gdtensor.io, gdtensor.builder, gdtensor.session, gdtensor.access, gdtensor.tag, gdtensor_sim.models"
      - name: Pytest (torch tests skip without torch)
        commands:
          - uv run --locked pytest -v -p no:cacheprovider
