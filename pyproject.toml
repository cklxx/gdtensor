[project]
name = "gdtensor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
torch = [
    "torch>=2.12",
]
torch-cpu = [
    "torch>=2.12",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8.0",
    "ruff>=0.17.1",
    "ty==0.0.14",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.ty.environment]
python = ".venv"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search-path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "torch" }, { extra = "torch-cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "torch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
